<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-beltway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <pattern id="grid_project-beltway" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-beltway)" />
  <rect width="640" height="380" fill="url(#grid_project-beltway)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#2563eb" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">WEBSITE DEVELOPMENT</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">Commercial Property • SBU Infrastructure</text>

  <!-- Illustration Graphic -->
  <g transform="translate(235, 95)">
      <!-- Commercial Office Towers -->
      <rect x="0" y="25" width="65" height="150" rx="4" fill="#1e293b" />
      <rect x="5" y="32" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.7" />
      <rect x="22" y="32" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.9" />
      <rect x="39" y="32" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.5" />
      <rect x="5" y="50" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.8" />
      <rect x="22" y="50" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.7" />
      <rect x="39" y="50" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.9" />
      <rect x="5" y="68" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.6" />
      <rect x="22" y="68" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.8" />
      <rect x="39" y="68" width="12" height="10" rx="2" fill="#93c5fd" opacity="0.7" />
      
      <!-- Tower 2 -->
      <rect x="75" y="0" width="95" height="175" rx="5" fill="#0f172a" />
      <polygon points="122, -15 118, 0 126, 0" fill="#38bdf8" />
      <line x1="122" y1="-15" x2="122" y2="0" stroke="#38bdf8" stroke-width="2" />
      <!-- Windows -->
      <g fill="#38bdf8" opacity="0.85">
        <rect x="85" y="15" width="14" height="12" rx="2" />
        <rect x="105" y="15" width="14" height="12" rx="2" />
        <rect x="125" y="15" width="14" height="12" rx="2" />
        <rect x="145" y="15" width="14" height="12" rx="2" />
        <rect x="85" y="35" width="14" height="12" rx="2" />
        <rect x="105" y="35" width="14" height="12" rx="2" opacity="0.4" />
        <rect x="125" y="35" width="14" height="12" rx="2" />
        <rect x="145" y="35" width="14" height="12" rx="2" />
        <rect x="85" y="55" width="14" height="12" rx="2" />
        <rect x="105" y="55" width="14" height="12" rx="2" />
        <rect x="125" y="55" width="14" height="12" rx="2" />
        <rect x="145" y="55" width="14" height="12" rx="2" opacity="0.5" />
      </g>
      <!-- Base Ground -->
      <rect x="-20" y="170" width="210" height="8" rx="4" fill="#334155" />
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">Company Profile — Beltway Office Park</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#2563eb" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>