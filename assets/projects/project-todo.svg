<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-todo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <pattern id="grid_project-todo" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-todo)" />
  <rect width="640" height="380" fill="url(#grid_project-todo)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#6366f1" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">WEB APPLICATION</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">Task Management • LocalStorage</text>

  <!-- Illustration Graphic -->
  <g transform="translate(235, 105)">
      <rect x="0" y="0" width="170" height="155" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <rect x="0" y="0" width="170" height="30" rx="10" fill="#6366f1" />
      <rect x="0" y="20" width="170" height="10" fill="#6366f1" />
      <text x="85" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">MY DAILY TASKS</text>
      
      <!-- Item 1 Done -->
      <circle cx="25" cy="52" r="7" fill="#10b981" />
      <path d="M22 52 L24 54 L29 49" stroke="#ffffff" stroke-width="1.8" fill="none" />
      <line x1="42" y1="52" x2="135" y2="52" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      
      <!-- Item 2 Done -->
      <circle cx="25" cy="78" r="7" fill="#10b981" />
      <path d="M22 78 L24 80 L29 75" stroke="#ffffff" stroke-width="1.8" fill="none" />
      <line x1="42" y1="78" x2="120" y2="78" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      
      <!-- Item 3 Pending -->
      <circle cx="25" cy="104" r="7" fill="none" stroke="#6366f1" stroke-width="2" />
      <rect x="42" y="100" width="105" height="7" rx="3" fill="#334155" />

      <!-- Item 4 In Progress -->
      <circle cx="25" cy="130" r="7" fill="none" stroke="#f59e0b" stroke-width="2" />
      <rect x="42" y="126" width="85" height="7" rx="3" fill="#64748b" />
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">Aplikasi To-Do List</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#6366f1" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>