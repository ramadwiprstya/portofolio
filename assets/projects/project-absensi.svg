<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-absensi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="grid_project-absensi" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-absensi)" />
  <rect width="640" height="380" fill="url(#grid_project-absensi)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#ef4444" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">FULL-STACK DEVELOPMENT</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">Laravel • PHP • MySQL</text>

  <!-- Illustration Graphic -->
  <g transform="translate(240, 110)">
      <!-- Attendance Calendar / Checkboard -->
      <rect x="0" y="0" width="160" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <rect x="0" y="0" width="160" height="34" rx="10" fill="#ef4444" />
      <rect x="0" y="24" width="160" height="10" fill="#ef4444" />
      <circle cx="20" cy="17" r="4" fill="#ffffff" opacity="0.8" />
      <circle cx="36" cy="17" r="4" fill="#ffffff" opacity="0.8" />
      <text x="80" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ABSENSI HARIAN</text>
      <!-- Grid rows -->
      <circle cx="30" cy="58" r="8" fill="#10b981" />
      <path d="M26 58 L29 61 L35 55" stroke="#ffffff" stroke-width="2" fill="none" />
      <rect x="48" y="54" width="85" height="8" rx="4" fill="#f1f5f9" />
      
      <circle cx="30" cy="84" r="8" fill="#10b981" />
      <path d="M26 84 L29 87 L35 81" stroke="#ffffff" stroke-width="2" fill="none" />
      <rect x="48" y="80" width="70" height="8" rx="4" fill="#f1f5f9" />
      
      <circle cx="30" cy="110" r="8" fill="#3b82f6" />
      <text x="30" y="114" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">I</text>
      <rect x="48" y="106" width="92" height="8" rx="4" fill="#f1f5f9" />
      
      <circle cx="30" cy="134" r="6" fill="#ef4444" />
      <rect x="48" y="131" width="60" height="6" rx="3" fill="#f1f5f9" />
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">Website Absensi Sekolah</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#ef4444" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>