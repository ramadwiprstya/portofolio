<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-retail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid_project-retail" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-retail)" />
  <rect width="640" height="380" fill="url(#grid_project-retail)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#06b6d4" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">DATA ANALYTICS</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">ETL • Sales Trends • BI Dashboard</text>

  <!-- Illustration Graphic -->
  <g transform="translate(230, 100)">
      <rect x="0" y="0" width="180" height="155" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <rect x="0" y="0" width="180" height="26" rx="10" fill="#0f172a" />
      <rect x="0" y="16" width="180" height="10" fill="#0f172a" />
      <circle cx="15" cy="13" r="3" fill="#ef4444" />
      <circle cx="25" cy="13" r="3" fill="#f59e0b" />
      <circle cx="35" cy="13" r="3" fill="#10b981" />
      <text x="100" y="17" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">RETAIL SALES DASHBOARD</text>

      <!-- Bar charts -->
      <line x1="20" y1="130" x2="160" y2="130" stroke="#e2e8f0" stroke-width="1.5" />
      <rect x="30" y="85" width="16" height="45" rx="3" fill="#0284c7" />
      <rect x="54" y="60" width="16" height="70" rx="3" fill="#06b6d4" />
      <rect x="78" y="95" width="16" height="35" rx="3" fill="#0284c7" />
      <rect x="102" y="48" width="16" height="82" rx="3" fill="#06b6d4" />
      <rect x="126" y="70" width="16" height="60" rx="3" fill="#0284c7" />

      <!-- Trend Line -->
      <path d="M38 78 Q78 45 110 40 T150 55" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="110" cy="40" r="3.5" fill="#f59e0b" />
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">Data Analyst — Dataset Toko Retail</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#06b6d4" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>