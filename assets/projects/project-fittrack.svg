<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-fittrack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <pattern id="grid_project-fittrack" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-fittrack)" />
  <rect width="640" height="380" fill="url(#grid_project-fittrack)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#10b981" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">WEB APPLICATION</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">Calorie • Food Log • Reporting</text>

  <!-- Illustration Graphic -->
  <g transform="translate(230, 105)">
      <!-- FitTrack Calorie Ring and Stat Bars -->
      <rect x="0" y="0" width="180" height="155" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <circle cx="55" cy="65" r="36" fill="none" stroke="#e2e8f0" stroke-width="8" />
      <circle cx="55" cy="65" r="36" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="226" stroke-dashoffset="65" stroke-linecap="round" />
      <text x="55" y="62" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">1,850</text>
      <text x="55" y="75" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">kcal</text>

      <rect x="110" y="38" width="55" height="7" rx="3" fill="#10b981" />
      <rect x="110" y="52" width="45" height="7" rx="3" fill="#3b82f6" />
      <rect x="110" y="66" width="38" height="7" rx="3" fill="#f59e0b" />
      <rect x="110" y="80" width="50" height="7" rx="3" fill="#cbd5e1" />

      <!-- Bottom Mini Chart -->
      <line x1="20" y1="135" x2="160" y2="135" stroke="#f1f5f9" stroke-width="1.5" />
      <rect x="25" y="115" width="12" height="20" rx="2" fill="#10b981" opacity="0.7" />
      <rect x="45" y="105" width="12" height="30" rx="2" fill="#10b981" />
      <rect x="65" y="110" width="12" height="25" rx="2" fill="#10b981" opacity="0.8" />
      <rect x="85" y="98" width="12" height="37" rx="2" fill="#10b981" />
      <rect x="105" y="108" width="12" height="27" rx="2" fill="#10b981" opacity="0.85" />
      <rect x="125" y="112" width="12" height="23" rx="2" fill="#10b981" opacity="0.7" />
      <rect x="145" y="100" width="12" height="35" rx="2" fill="#10b981" />
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">FitTrack Nutrition & Calorie</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#10b981" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>