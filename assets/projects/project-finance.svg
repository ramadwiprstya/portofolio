<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-finance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <pattern id="grid_project-finance" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-finance)" />
  <rect width="640" height="380" fill="url(#grid_project-finance)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#0d9488" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">WEB APPLICATION</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">Income & Expense • Cashflow</text>

  <!-- Illustration Graphic -->
  <g transform="translate(230, 100)">
      <rect x="0" y="0" width="180" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <rect x="15" y="15" width="150" height="42" rx="8" fill="#0d9488" />
      <text x="30" y="32" font-family="sans-serif" font-size="9" fill="#ccfbf1">TOTAL BALANCE</text>
      <text x="30" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Rp 12.850.000</text>
      
      <!-- Income badge -->
      <rect x="15" y="68" width="70" height="26" rx="5" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="25" y="84" font-family="sans-serif" font-size="9" font-weight="bold" fill="#16a34a">+ Rp 4.5M</text>
      
      <!-- Expense badge -->
      <rect x="95" y="68" width="70" height="26" rx="5" fill="#fef2f2" stroke="#fecaca" />
      <text x="105" y="84" font-family="sans-serif" font-size="9" font-weight="bold" fill="#dc2626">- Rp 1.2M</text>

      <!-- Wave Trend -->
      <path d="M15 140 Q50 110 85 130 T165 115" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
      <circle cx="165" cy="115" r="4" fill="#0d9488" />
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">Aplikasi Pencatatan Keuangan</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#0d9488" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>