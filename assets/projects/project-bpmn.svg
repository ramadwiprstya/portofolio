<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-bpmn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <pattern id="grid_project-bpmn" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-bpmn)" />
  <rect width="640" height="380" fill="url(#grid_project-bpmn)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#7c3aed" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">BUSINESS ANALYSIS</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">BPMN 2.0 • AS-IS & TO-BE Modeling</text>

  <!-- Illustration Graphic -->
  <g transform="translate(225, 105)">
      <rect x="0" y="0" width="190" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <!-- BPMN Start -->
      <circle cx="30" cy="50" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
      <line x1="42" y1="50" x2="68" y2="50" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
      
      <!-- Task 1 -->
      <rect x="68" y="32" width="52" height="36" rx="5" fill="#f8fafc" stroke="#7c3aed" stroke-width="2" />
      <rect x="74" y="44" width="40" height="4" rx="2" fill="#7c3aed" />
      <rect x="74" y="52" width="28" height="4" rx="2" fill="#cbd5e1" />
      
      <!-- Gateway -->
      <line x1="120" y1="50" x2="142" y2="50" stroke="#64748b" stroke-width="2" />
      <polygon points="152,38 164,50 152,62 140,50" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
      
      <!-- Branch Down -->
      <line x1="152" y1="62" x2="152" y2="95" stroke="#64748b" stroke-width="2" />
      <rect x="126" y="95" width="52" height="36" rx="5" fill="#f8fafc" stroke="#2563eb" stroke-width="2" />
      <rect x="132" y="108" width="40" height="4" rx="2" fill="#2563eb" />
      
      <!-- Branch Left to End -->
      <line x1="126" y1="113" x2="65" y2="113" stroke="#64748b" stroke-width="2" />
      <circle cx="50" cy="113" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3" />
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">Business Process Analyst — PT Pegadaian</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#7c3aed" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>