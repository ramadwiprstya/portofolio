<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-togaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <pattern id="grid_project-togaf" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-togaf)" />
  <rect width="640" height="380" fill="url(#grid_project-togaf)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#2563eb" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">ENTERPRISE ARCHITECTURE</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">TOGAF ADM • Business & IT Alignment</text>

  <!-- Illustration Graphic -->
  <g transform="translate(230, 95)">
      <!-- TOGAF Wheel / Architecture Layers -->
      <rect x="0" y="0" width="180" height="165" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      
      <!-- Layer 1 Business -->
      <rect x="15" y="16" width="150" height="28" rx="5" fill="#eff6ff" stroke="#93c5fd" />
      <text x="90" y="34" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">BUSINESS ARCHITECTURE</text>
      
      <!-- Layer 2 Data & Application -->
      <rect x="15" y="52" width="70" height="30" rx="5" fill="#faf5ff" stroke="#d8b4fe" />
      <text x="50" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#6b21a8" text-anchor="middle">DATA</text>
      
      <rect x="95" y="52" width="70" height="30" rx="5" fill="#f0fdf4" stroke="#86efac" />
      <text x="130" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#166534" text-anchor="middle">APPLICATION</text>
      
      <!-- Layer 3 Technology -->
      <rect x="15" y="90" width="150" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="90" y="108" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">TECHNOLOGY &amp; CLOUD</text>

      <!-- Connecting arrows -->
      <line x1="90" y1="126" x2="90" y2="152" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3" />
      <text x="90" y="146" font-family="sans-serif" font-size="8" font-weight="bold" fill="#2563eb" text-anchor="middle">TOGAF ADM PHASE A-H</text>
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">Enterprise Architecture — PT Graha Kreatif</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#2563eb" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>