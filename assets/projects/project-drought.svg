<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-drought" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <pattern id="grid_project-drought" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="640" height="380" fill="url(#bgGrad_project-drought)" />
  <rect width="640" height="380" fill="url(#grid_project-drought)" />

  <!-- Top Glass Bar -->
  <rect x="25" y="20" width="590" height="38" rx="8" fill="#ffffff" opacity="0.08" />
  <circle cx="48" cy="39" r="5" fill="#ff5f56" />
  <circle cx="64" cy="39" r="5" fill="#ffbd2e" />
  <circle cx="80" cy="39" r="5" fill="#27c93f" />

  <!-- Category & Tag -->
  <rect x="105" y="27" width="170" height="24" rx="12" fill="#0284c7" opacity="0.9" />
  <text x="190" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">INFORMATION SYSTEM</text>

  <text x="595" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">GIS • Water Mitigation • Analytics</text>

  <!-- Illustration Graphic -->
  <g transform="translate(230, 100)">
      <rect x="0" y="0" width="180" height="160" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
      <!-- Map Graphic -->
      <path d="M20 30 Q60 20 90 45 T160 35 L160 140 Q110 155 70 135 T20 140 Z" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
      <!-- Water Droplet Pin 1 -->
      <circle cx="65" cy="70" r="14" fill="#ef4444" opacity="0.9" />
      <text x="65" y="74" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
      
      <!-- Pin 2 -->
      <circle cx="125" cy="85" r="10" fill="#f59e0b" opacity="0.9" />
      
      <!-- Pin 3 Normal -->
      <circle cx="95" cy="115" r="10" fill="#0284c7" opacity="0.9" />
      <path d="M95 109 C91 114 91 117 95 119 C99 117 99 114 95 109 Z" fill="#ffffff" />
      
      <!-- Radar Sweep Line -->
      <circle cx="95" cy="85" r="60" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
    </g>

  <!-- Bottom Title Overlay Bar -->
  <rect x="0" y="300" width="640" height="80" fill="#0f172a" opacity="0.85" />
  <line x1="0" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" />
  <text x="35" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#f8fafc">Sistem Monitoring Kekeringan Gunungkidul</text>
  <text x="35" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Klik "View Details" untuk melihat ringkasan, teknologi &amp; repository</text>
  
  <rect x="510" y="325" width="95" height="30" rx="6" fill="#0284c7" />
  <text x="557" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DETAILS →</text>
</svg>